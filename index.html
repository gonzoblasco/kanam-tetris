<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris v0.4</title>
<link rel="stylesheet" href="styles/kanam.css">
<link rel="stylesheet" href="styles/dark.css">
<link rel="stylesheet" href="styles/theme.css">
</head>
<body>

<div id="game">
  <div id="board-stack">
    <div id="board-wrap">
      <canvas id="board" width="300" height="600"></canvas>
    </div>
    <div id="overlay">
      <h1 id="overlay-title">Fin del juego</h1>
      <p id="overlay-sub">Pulsa Enter o el botón para reiniciar</p>
      <button id="restart">Reiniciar</button>
    </div>
  </div>

  <div id="side">
    <div id="previews">
      <div class="panel">
        <h2>Reserva</h2>
        <canvas id="hold" width="80" height="60"></canvas>
      </div>
      <div class="panel">
        <h2>Siguiente</h2>
        <canvas id="next" width="80" height="60"></canvas>
      </div>
    </div>
    <div class="panel" id="queue-panel">
      <h2>Cola</h2>
      <canvas id="queue" width="60" height="104"></canvas>
    </div>
    <div class="panel secondary">
      <h2>Récord</h2>
      <div class="value" id="hiscore">0</div>
    </div>
    <div class="panel primary">
      <h2>Puntuación</h2>
      <div class="value" id="score">0</div>
      <div id="combo">x2 combo</div>
      <div id="b2b">BACK-TO-BACK</div>
      <div id="mute">MUTE</div>
    </div>
    <div class="panel secondary">
      <h2>Nivel</h2>
      <div class="value" id="level">1</div>
    </div>
    <div class="panel secondary">
      <h2>Líneas</h2>
      <div class="value" id="lines">0</div>
    </div>
    <div class="panel" id="controls">
      <h2>Controles</h2>
      <b>← →</b> mover<br>
      <b>↓</b> bajar<br>
      <b>↑</b> rotar<br>
      <b>Espacio</b> caída rápida<br>
      <b>C</b> reservar pieza<br>
      <b>M</b> silenciar<br>
      <b>P / Esc</b> pausa
    </div>
  </div>
</div>

<script type="module" src="src/main.js?v=20260915-v05"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris v0.4</title>
<style>
  /* ---------- Dark minimal theme, wireframe "cajitas" (v0.4) ---------- */
  :root {
    --bg: #0a0c0f;
    --panel: #0f1217;
    --border: #222a36;
    --board-border: #3a4658;
    --text: #d7dde5;
    --text-dim: #848d9e;
    --accent: #5eead4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Subtle dot field behind everything; it frames the two flat panels
     and never competes with the board dots (canvas) or the wireframe. */
  body {
    background: var(--bg);
    background-image: radial-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--text);
    font-family: "SF Mono", "Fira Code", Consolas, monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- Layout: board + side panel ---------- */
  #game {
    display: flex;
    gap: 28px;
    padding: 24px;
  }

  /* The board container tilts like a slab resting on the table; the
     canvas itself stays an undistorted rect grid inside (no column
     misreading). The tilt is a perspective hint, not a bend. */
  #board-wrap {
    perspective: 1000px;
  }

  #board {
    background: var(--panel);
    border: 1px solid var(--board-border);
    border-radius: 8px;
    display: block;
    transform: rotateX(12deg);
    transform-origin: 50% 20%;
    box-shadow: 0 24px 48px rgba(0, 0, 0, 0.55), 0 3px 10px rgba(0, 0, 0, 0.4);
  }

  #side {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 200px;
  }

  /* Hold + next previews sit side by side to keep the column compact. */
  #previews {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  /* The 4 trailing queue pieces are small and dimmer: support information,
     not the main readout. */
  #queue-panel canvas {
    opacity: 0.72;
  }

  /* Combo counter: only meaningful while a chain is alive, so it is hidden
     by default and revealed by the .visible class. */
  #combo {
    font-size: 14px;
    color: var(--accent);
    display: none;
  }

  #combo.visible { display: block; }

  /* Back-to-back badge: a quiet outlined chip, same wireframe grammar. */
  #b2b {
    display: none;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: #c084fc;
    border: 1px solid rgba(192, 132, 252, 0.5);
    border-radius: 4px;
    padding: 3px 6px;
    margin-top: 6px;
    text-align: center;
  }

  #b2b.visible { display: block; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
  }

  .panel h2 {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .panel .value {
    font-size: 20px;
    font-weight: 700;
  }

  /* Main instrument: the score is the biggest, most readable readout.
     The rest are support dials: smaller and dimmer. */
  .panel.primary .value {
    font-size: 30px;
    color: var(--accent);
  }

  .panel.secondary .value {
    font-size: 16px;
    color: var(--text-dim);
  }

  .panel canvas {
    display: block;
    margin: 0 auto;
  }

  #controls {
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.8;
  }

  #controls b {
    color: var(--text);
    font-weight: 600;
  }

  /* ---------- Overlays (game over / pause) ---------- */
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(10, 12, 15, 0.86);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    border-radius: 8px;
    text-align: center;
  }

  #overlay.visible { display: flex; }

  #overlay h1 {
    font-size: 26px;
    font-weight: 700;
    color: var(--accent);
  }

  #overlay p {
    color: var(--text-dim);
    font-size: 13px;
  }

  #restart {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 10px 24px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  #restart:hover {
    background: var(--accent);
    color: var(--bg);
  }
</style>
</head>
<body>

<div id="game">
  <div id="board-wrap" style="position: relative;">
    <canvas id="board" width="300" height="600"></canvas>
    <div id="overlay">
      <h1 id="overlay-title">Fin del juego</h1>
      <p id="overlay-sub">Pulsa Enter o el botón para reiniciar</p>
      <button id="restart">Reiniciar</button>
    </div>
  </div>

  <div id="side">
    <div id="previews">
      <div class="panel">
        <h2>Reserva</h2>
        <canvas id="hold" width="80" height="60"></canvas>
      </div>
      <div class="panel">
        <h2>Siguiente</h2>
        <canvas id="next" width="80" height="60"></canvas>
      </div>
    </div>
    <div class="panel" id="queue-panel">
      <h2>Cola</h2>
      <canvas id="queue" width="60" height="104"></canvas>
    </div>
    <div class="panel secondary">
      <h2>Récord</h2>
      <div class="value" id="hiscore">0</div>
    </div>
    <div class="panel primary">
      <h2>Puntuación</h2>
      <div class="value" id="score">0</div>
      <div id="combo">x2 combo</div>
      <div id="b2b">BACK-TO-BACK</div>
    </div>
    <div class="panel secondary">
      <h2>Nivel</h2>
      <div class="value" id="level">1</div>
    </div>
    <div class="panel secondary">
      <h2>Líneas</h2>
      <div class="value" id="lines">0</div>
    </div>
    <div class="panel" id="controls">
      <h2>Controles</h2>
      <b>← →</b> mover<br>
      <b>↓</b> bajar<br>
      <b>↑</b> rotar<br>
      <b>Espacio</b> caída rápida<br>
      <b>C</b> reservar pieza<br>
      <b>P / Esc</b> pausa
    </div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
